services:
  - type: web
    name: batc-backend
    env: python
    rootDir: batc/batc-backend
    buildCommand: >-
      pip install -r requirements/production.txt &&
      python manage.py collectstatic --noinput
    startCommand: bash start.sh
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: CRYPTOGRAPHY_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://23150056-beep.github.io"
    plan: free
