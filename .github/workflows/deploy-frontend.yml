name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write           # needed by peaceiris/actions-gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: batc/batc-frontend/package-lock.json

      - name: Install dependencies
        working-directory: batc/batc-frontend
        run: npm ci

      - name: Generate MSW service worker
        working-directory: batc/batc-frontend
        run: npx msw init public/ --save

      - name: Build (demo mode — MSW intercepts all API calls)
        working-directory: batc/batc-frontend
        run: npm run build
        env:
          VITE_USE_MOCK: "true"

      - name: Add .nojekyll (prevent Jekyll from ignoring _files)
        run: touch batc/batc-frontend/dist/.nojekyll

      - name: Copy index.html → 404.html for SPA routing
        run: cp batc/batc-frontend/dist/index.html batc/batc-frontend/dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: batc/batc-frontend/dist
