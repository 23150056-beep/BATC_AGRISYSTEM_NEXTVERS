<svg viewBox="0 0 3000 2000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .table-header { fill: #34495E; stroke: #000; stroke-width: 2; }
      .table-body { fill: #FFFFFF; stroke: #000; stroke-width: 2; }
      .table-name { fill: white; font-weight: bold; font-size: 12px; font-family: Arial, sans-serif; }
      .field { fill: black; font-size: 10px; font-family: Arial, sans-serif; }
      .pk { font-weight: bold; }
      .fk { font-style: italic; }
      .line { stroke: #000; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <!-- Title -->
  <text x="1500" y="30" font-size="22" font-weight="bold" text-anchor="middle" font-family="Arial">BATC System - Entity Relationship Diagram</text>

  <!-- ============ ROW 1: USER ============ -->
  <rect x="1200" y="80" width="180" height="24" class="table-header"/>
  <text x="1290" y="97" text-anchor="middle" class="table-name">tbl_user</text>
  <rect x="1200" y="104" width="180" height="125" class="table-body"/>
  <line x1="1200" y1="118" x2="1380" y2="118" stroke="#000" stroke-width="1"/>
  <text x="1210" y="131" class="field pk">PK user_id</text>
  <text x="1210" y="144" class="field">username</text>
  <text x="1210" y="157" class="field">password</text>
  <text x="1210" y="170" class="field">email</text>
  <text x="1210" y="183" class="field">role</text>
  <text x="1210" y="196" class="field">is_active</text>
  <text x="1210" y="209" class="field">created_at</text>

  <!-- ============ ROW 2: FARMER | PROGRAM | ANNOUNCEMENT ============ -->
  
  <!-- FARMER (LEFT) -->
  <rect x="150" y="350" width="200" height="24" class="table-header"/>
  <text x="250" y="367" text-anchor="middle" class="table-name">tbl_farmer</text>
  <rect x="150" y="374" width="200" height="155" class="table-body"/>
  <line x1="150" y1="390" x2="350" y2="390" stroke="#000" stroke-width="1"/>
  <text x="160" y="403" class="field pk">PK farmer_id</text>
  <text x="160" y="416" class="field fk">FK linked_user_id</text>
  <text x="160" y="429" class="field fk">FK encoded_by_id</text>
  <text x="160" y="442" class="field">first_name</text>
  <text x="160" y="455" class="field">last_name</text>
  <text x="160" y="468" class="field">mobile_number</text>
  <text x="160" y="481" class="field">barangay</text>
  <text x="160" y="494" class="field">household_size</text>
  <text x="160" y="507" class="field">created_at</text>

  <!-- PROGRAM (CENTER-RIGHT) -->
  <rect x="1400" y="350" width="200" height="24" class="table-header"/>
  <text x="1500" y="367" text-anchor="middle" class="table-name">tbl_program</text>
  <rect x="1400" y="374" width="200" height="145" class="table-body"/>
  <line x1="1400" y1="390" x2="1600" y2="390" stroke="#000" stroke-width="1"/>
  <text x="1410" y="403" class="field pk">PK program_id</text>
  <text x="1410" y="416" class="field">name</text>
  <text x="1410" y="429" class="field">description</text>
  <text x="1410" y="442" class="field">start_date</text>
  <text x="1410" y="455" class="field">end_date</text>
  <text x="1410" y="468" class="field">status</text>
  <text x="1410" y="481" class="field">created_by_id (FK)</text>
  <text x="1410" y="494" class="field">created_at</text>

  <!-- ANNOUNCEMENT (RIGHT) -->
  <rect x="2550" y="350" width="200" height="24" class="table-header"/>
  <text x="2650" y="367" text-anchor="middle" class="table-name">tbl_announcement</text>
  <rect x="2550" y="374" width="200" height="120" class="table-body"/>
  <line x1="2550" y1="390" x2="2750" y2="390" stroke="#000" stroke-width="1"/>
  <text x="2560" y="403" class="field pk">PK announcement_id</text>
  <text x="2560" y="416" class="field fk">FK created_by_id</text>
  <text x="2560" y="429" class="field">title</text>
  <text x="2560" y="442" class="field">content</text>
  <text x="2560" y="455" class="field">target_roles</text>
  <text x="2560" y="468" class="field">published_at</text>

  <!-- ============ ROW 3: FARM_PARCEL | APPLICATION | ACTIVITY_LOG ============ -->
  
  <!-- FARM_PARCEL (LEFT) -->
  <rect x="80" y="700" width="180" height="24" class="table-header"/>
  <text x="170" y="717" text-anchor="middle" class="table-name">tbl_farm_parcel</text>
  <rect x="80" y="724" width="180" height="100" class="table-body"/>
  <line x1="80" y1="738" x2="260" y2="738" stroke="#000" stroke-width="1"/>
  <text x="90" y="751" class="field pk">PK parcel_id</text>
  <text x="90" y="764" class="field fk">FK farmer_id</text>
  <text x="90" y="777" class="field">area_ha</text>
  <text x="90" y="790" class="field">commodity</text>
  <text x="90" y="803" class="field">land_type</text>

  <!-- APPLICATION (CENTER) -->
  <rect x="1100" y="700" width="240" height="24" class="table-header"/>
  <text x="1220" y="717" text-anchor="middle" class="table-name">tbl_intervention_application</text>
  <rect x="1100" y="724" width="240" height="170" class="table-body"/>
  <line x1="1100" y1="738" x2="1340" y2="738" stroke="#000" stroke-width="1"/>
  <text x="1110" y="751" class="field pk">PK application_id</text>
  <text x="1110" y="764" class="field fk">FK farmer_id</text>
  <text x="1110" y="777" class="field fk">FK program_id</text>
  <text x="1110" y="790" class="field fk">FK approved_by_id</text>
  <text x="1110" y="803" class="field fk">FK rejected_by_id</text>
  <text x="1110" y="816" class="field">status</text>
  <text x="1110" y="829" class="field">applied_at</text>
  <text x="1110" y="842" class="field">reviewed_at</text>
  <text x="1110" y="855" class="field">created_at</text>

  <!-- ACTIVITY_LOG (RIGHT) -->
  <rect x="2500" y="700" width="180" height="24" class="table-header"/>
  <text x="2590" y="717" text-anchor="middle" class="table-name">tbl_activity_log</text>
  <rect x="2500" y="724" width="180" height="100" class="table-body"/>
  <line x1="2500" y1="738" x2="2680" y2="738" stroke="#000" stroke-width="1"/>
  <text x="2510" y="751" class="field pk">PK log_id</text>
  <text x="2510" y="764" class="field fk">FK user_id</text>
  <text x="2510" y="777" class="field">log_action</text>
  <text x="2510" y="790" class="field">log_time</text>
  <text x="2510" y="803" class="field">log_description</text>

  <!-- ============ ROW 4: PROGRAM_ITEM | INVENTORY_ITEM | ELIGIBILITY ============ -->
  
  <!-- PROGRAM_ITEM (LEFT-CENTER) -->
  <rect x="1400" y="1050" width="200" height="24" class="table-header"/>
  <text x="1500" y="1067" text-anchor="middle" class="table-name">tbl_program_item</text>
  <rect x="1400" y="1074" width="200" height="100" class="table-body"/>
  <line x1="1400" y1="1088" x2="1600" y2="1088" stroke="#000" stroke-width="1"/>
  <text x="1410" y="1101" class="field pk">PK program_item_id</text>
  <text x="1410" y="1114" class="field fk">FK program_id</text>
  <text x="1410" y="1127" class="field fk">FK inventory_item_id</text>
  <text x="1410" y="1140" class="field">allocated_qty</text>

  <!-- INVENTORY_ITEM (CENTER) -->
  <rect x="1750" y="1050" width="200" height="24" class="table-header"/>
  <text x="1850" y="1067" text-anchor="middle" class="table-name">tbl_inventory_item</text>
  <rect x="1750" y="1074" width="200" height="115" class="table-body"/>
  <line x1="1750" y1="1088" x2="1950" y2="1088" stroke="#000" stroke-width="1"/>
  <text x="1760" y="1101" class="field pk">PK inventory_item_id</text>
  <text x="1760" y="1114" class="field">name</text>
  <text x="1760" y="1127" class="field">unit</text>
  <text x="1760" y="1140" class="field">current_qty</text>
  <text x="1760" y="1153" class="field">created_at</text>

  <!-- ELIGIBILITY_CRITERION (RIGHT) -->
  <rect x="2100" y="1050" width="220" height="24" class="table-header"/>
  <text x="2210" y="1067" text-anchor="middle" class="table-name">tbl_eligibility_criterion</text>
  <rect x="2100" y="1074" width="220" height="100" class="table-body"/>
  <line x1="2100" y1="1088" x2="2320" y2="1088" stroke="#000" stroke-width="1"/>
  <text x="2110" y="1101" class="field pk">PK criterion_id</text>
  <text x="2110" y="1114" class="field fk">FK program_id</text>
  <text x="2110" y="1127" class="field">field_name</text>
  <text x="2110" y="1140" class="field">operator</text>

  <!-- ============ ROW 5: DISTRIBUTION | STOCK_BATCH ============ -->
  
  <!-- DISTRIBUTION (LEFT-CENTER) -->
  <rect x="850" y="1400" width="240" height="24" class="table-header"/>
  <text x="970" y="1417" text-anchor="middle" class="table-name">tbl_distribution</text>
  <rect x="850" y="1424" width="240" height="170" class="table-body"/>
  <line x1="850" y1="1438" x2="1090" y2="1438" stroke="#000" stroke-width="1"/>
  <text x="860" y="1451" class="field pk">PK distribution_id</text>
  <text x="860" y="1464" class="field fk">FK application_id</text>
  <text x="860" y="1477" class="field fk">FK inventory_item_id</text>
  <text x="860" y="1490" class="field">qty</text>
  <text x="860" y="1503" class="field">status</text>
  <text x="860" y="1516" class="field">scheduled_date</text>
  <text x="860" y="1529" class="field">delivered_at</text>
  <text x="860" y="1542" class="field">confirmed_at</text>
  <text x="860" y="1555" class="field">created_at</text>

  <!-- STOCK_BATCH (CENTER-RIGHT) -->
  <rect x="1650" y="1400" width="200" height="24" class="table-header"/>
  <text x="1750" y="1417" text-anchor="middle" class="table-name">tbl_stock_batch</text>
  <rect x="1650" y="1424" width="200" height="130" class="table-body"/>
  <line x1="1650" y1="1438" x2="1850" y2="1438" stroke="#000" stroke-width="1"/>
  <text x="1660" y="1451" class="field pk">PK batch_id</text>
  <text x="1660" y="1464" class="field fk">FK inventory_item_id</text>
  <text x="1660" y="1477" class="field">lot_number</text>
  <text x="1660" y="1490" class="field">quantity_received</text>
  <text x="1660" y="1503" class="field">expiry_date</text>
  <text x="1660" y="1516" class="field">received_date</text>
  <text x="1660" y="1529" class="field">received_by_id</text>

  <!-- ============ ROW 6: BATCH_ALLOCATION | STOCK_MOVEMENT | FEEDBACK ============ -->
  
  <!-- BATCH_ALLOCATION (LEFT-CENTER) -->
  <rect x="1000" y="1750" width="220" height="24" class="table-header"/>
  <text x="1110" y="1767" text-anchor="middle" class="table-name">tbl_batch_allocation</text>
  <rect x="1000" y="1774" width="220" height="100" class="table-body"/>
  <line x1="1000" y1="1788" x2="1220" y2="1788" stroke="#000" stroke-width="1"/>
  <text x="1010" y="1801" class="field pk">PK allocation_id</text>
  <text x="1010" y="1814" class="field fk">FK distribution_id</text>
  <text x="1010" y="1827" class="field fk">FK stock_batch_id</text>
  <text x="1010" y="1840" class="field">qty</text>

  <!-- STOCK_MOVEMENT (CENTER-RIGHT) -->
  <rect x="1450" y="1750" width="220" height="24" class="table-header"/>
  <text x="1560" y="1767" text-anchor="middle" class="table-name">tbl_stock_movement</text>
  <rect x="1450" y="1774" width="220" height="115" class="table-body"/>
  <line x1="1450" y1="1788" x2="1670" y2="1788" stroke="#000" stroke-width="1"/>
  <text x="1460" y="1801" class="field pk">PK movement_id</text>
  <text x="1460" y="1814" class="field fk">FK inventory_item_id</text>
  <text x="1460" y="1827" class="field fk">FK stock_batch_id</text>
  <text x="1460" y="1840" class="field">movement_type</text>
  <text x="1460" y="1853" class="field">qty (signed)</text>

  <!-- FEEDBACK (RIGHT) -->
  <rect x="2100" y="1750" width="200" height="24" class="table-header"/>
  <text x="2200" y="1767" text-anchor="middle" class="table-name">tbl_feedback</text>
  <rect x="2100" y="1774" width="200" height="115" class="table-body"/>
  <line x1="2100" y1="1788" x2="2300" y2="1788" stroke="#000" stroke-width="1"/>
  <text x="2110" y="1801" class="field pk">PK feedback_id</text>
  <text x="2110" y="1814" class="field fk">FK farmer_id</text>
  <text x="2110" y="1827" class="field fk">FK distribution_id</text>
  <text x="2110" y="1840" class="field">rating (1-5)</text>
  <text x="2110" y="1853" class="field">comment</text>

  <!-- ============ NOTIFICATION ============ -->
  <rect x="2500" y="1050" width="200" height="24" class="table-header"/>
  <text x="2600" y="1067" text-anchor="middle" class="table-name">tbl_notification</text>
  <rect x="2500" y="1074" width="200" height="115" class="table-body"/>
  <line x1="2500" y1="1088" x2="2700" y2="1088" stroke="#000" stroke-width="1"/>
  <text x="2510" y="1101" class="field pk">PK notification_id</text>
  <text x="2510" y="1114" class="field fk">FK recipient_id</text>
  <text x="2510" y="1127" class="field">type</text>
  <text x="2510" y="1140" class="field">title</text>
  <text x="2510" y="1153" class="field">message</text>

  <!-- ============ CROW'S FOOT SYMBOLS ============ -->
  <!-- Function to draw crow's foot: three lines forming a fork -->
  <defs>
    <marker id="crow-foot-end" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6" stroke="#000" stroke-width="1" fill="none"/>
    </marker>
    <marker id="crow-foot-start" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto-start-reverse">
      <path d="M 6 0 L 0 3 L 6 6" stroke="#000" stroke-width="1" fill="none"/>
    </marker>
    <marker id="one-end" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1.5"/>
    </marker>
    <marker id="one-start" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto-start-reverse">
      <line x1="6" y1="0" x2="6" y2="6" stroke="#000" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- ============ RELATIONSHIPS ============ -->
  
  <!-- User -> Farmer (encoded_by) 1:M -->
  <path d="M 1290 229 L 1290 270 L 350 270 L 350 374" class="line" marker-end="url(#crow-foot-end)" marker-start="url(#one-start)"/>
  <text x="750" y="260" font-size="10" font-weight="bold">encoded_by</text>

  <!-- User -> Farmer (linked_user) 1:1 -->
  <path d="M 1220 229 L 1220 290 L 320 290 L 320 374" class="line" marker-end="url(#one-end)" marker-start="url(#one-start)"/>
  <text x="600" y="280" font-size="10" font-weight="bold">linked_user</text>

  <!-- User -> Program (created_by) 1:M -->
  <path d="M 1320 229 L 1320 320 L 1500 320 L 1500 350" class="line" marker-end="url(#crow-foot-end)" marker-start="url(#one-start)"/>
  <text x="1400" y="310" font-size="10" font-weight="bold">creates</text>

  <!-- User -> Announcement (created_by) 1:M -->
  <path d="M 1380 229 L 1380 310 L 2650 310 L 2650 374" class="line" marker-end="url(#crow-foot-end)" marker-start="url(#one-start)"/>
  <text x="1900" y="300" font-size="10" font-weight="bold">publishes</text>

  <!-- User -> Activity_Log (performs) 1:M -->
  <path d="M 1380 229 L 1380 640 L 2590 640 L 2590 724" class="line" marker-end="url(#crow-foot-end)" marker-start="url(#one-start)"/>
  <text x="1850" y="630" font-size="10" font-weight="bold">performs</text>

  <!-- User -> Notification (receives) 1:M -->
  <path d="M 1380 229 L 1380 1000 L 2600 1000 L 2600 1074" class="line" marker-end="url(#crow-foot-end)" marker-start="url(#one-start)"/>
  <text x="1700" y="990" font-size="10" font-weight="bold">sends</text>

  <!-- User -> Application (approved_by/rejected_by) -->
  <path d="M 1290 229 L 1290 660 L 1220 660 L 1220 724" class="line" marker-end="url(#crow-foot-end)" marker-start="url(#one-start)"/>
  <text x="1300" y="650" font-size="10" font-weight="bold">approves</text>

  <!-- Farmer -> Farm_Parcel (1:M) -->
  <path d="M 250 529 L 250 600 L 170 600 L 170 724" class="line" marker-end="url(#crow-foot-end)" marker-start="url(#one-start)"/>
  <text x="180" y="590" font-size="10" font-weight="bold">owns</text>

  <!-- Farmer -> Application (submits) (1:M) -->
  <path d="M 350 450 L 800 850 L 1100 850" class="line" marker-end="url(#crow-foot-end)" marker-start="url(#one-start)"/>
  <text x="700" y="640" font-size="10" font-weight="bold">submits</text>

  <!-- Farmer -> Feedback (gives) (1:M) -->
  <path d="M 350 529 L 350 1650 L 2100 1850" class="line" marker-end="url(#crow-foot-end)" marker-start="url(#one-start)"/>
  <text x="550" y="1200" font-size="10" font-weight="bold">gives</text>

  <!-- Program -> Application (offers) (1:M) -->
  <path d="M 1500 519 L 1500 660 L 1220 660 L 1220 724" class="line" marker-end="url(#crow-foot-end)" marker-start="url(#one-start)"/>
  <text x="1380" y="650" font-size="10" font-weight="bold">offers</text>

  <!-- Program -> Program_Item (includes) (1:M) -->
  <path d="M 1500 519 L 1500 1050" class="line" marker-end="url(#crow-foot-end)" marker-start="url(#one-start)"/>
  <text x="1520" y="750" font-size="10" font-weight="bold">includes</text>

  <!-- Program -> Eligibility_Criterion (defines) (1:M) -->
  <path d="M 1600 519 L 1600 980 L 2210 980 L 2210 1050" class="line" marker-end="url(#crow-foot-end)" marker-start="url(#one-start)"/>
  <text x="1750" y="980" font-size="10" font-weight="bold">defines</text>

  <!-- Program_Item -> Inventory_Item (allocates) (M:1) -->
  <path d="M 1600 1074 L 1750 1074" class="line" marker-end="url(#one-end)" marker-start="url(#crow-foot-start)"/>
  <text x="1640" y="1060" font-size="10" font-weight="bold">allocates</text>

  <!-- Inventory_Item -> Stock_Batch (contains) (1:M) -->
  <path d="M 1850 1189 L 1850 1280 L 1750 1280 L 1750 1424" class="line" marker-end="url(#crow-foot-end)" marker-start="url(#one-start)"/>
  <text x="1780" y="1330" font-size="10" font-weight="bold">contains</text>

  <!-- Application -> Distribution (triggers) (1:1) -->
  <path d="M 1220 894 L 1220 1300 L 970 1300 L 970 1424" class="line" marker-end="url(#one-end)" marker-start="url(#one-start)"/>
  <text x="1050" y="1300" font-size="10" font-weight="bold">triggers</text>

  <!-- Distribution -> Inventory_Item (distributes) (M:1) -->
  <path d="M 1090 1489 L 1650 1150" class="line" marker-end="url(#one-end)" marker-start="url(#crow-foot-start)"/>
  <text x="1300" y="1350" font-size="10" font-weight="bold">distributes</text>

  <!-- Distribution -> Batch_Allocation (uses) (1:M) -->
  <path d="M 970 1594 L 970 1650 L 1110 1650 L 1110 1774" class="line" marker-end="url(#crow-foot-end)" marker-start="url(#one-start)"/>
  <text x="990" y="1710" font-size="10" font-weight="bold">uses</text>

  <!-- Distribution -> Stock_Movement (releases_via) (1:M) -->
  <path d="M 1000 1594 L 1000 1670 L 1560 1670 L 1560 1774" class="line" marker-end="url(#crow-foot-end)" marker-start="url(#one-start)"/>
  <text x="1200" y="1660" font-size="10" font-weight="bold">releases_via</text>

  <!-- Distribution -> Feedback (receives) (1:M) -->
  <path d="M 1090 1594 L 1050 1650 L 2150 1800 L 2200 1750" class="line" marker-end="url(#crow-foot-end)" marker-start="url(#one-start)"/>
  <text x="1400" y="1710" font-size="10" font-weight="bold">receives</text>

  <!-- Batch_Allocation -> Stock_Batch (selects) (M:1) -->
  <path d="M 1220 1774 L 1220 1750 L 1750 1750 L 1750 1554" class="line" marker-end="url(#one-end)" marker-start="url(#crow-foot-start)"/>
  <text x="1650" y="1760" font-size="10" font-weight="bold">selects</text>

  <!-- Stock_Batch -> Stock_Movement (logged_in) (1:M) -->
  <path d="M 1750 1554 L 1750 1700 L 1560 1700 L 1560 1774" class="line" marker-end="url(#crow-foot-end)" marker-start="url(#one-start)"/>
  <text x="1700" y="1640" font-size="10" font-weight="bold">logged_in</text>

</svg>